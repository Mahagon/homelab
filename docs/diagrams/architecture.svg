<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Homelab architecture</title>
  <desc id="desc">Internet, GitOps, Cloudflare, K3s services, application services, and storage relationships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#475569; stroke-width:2 }
      .accent { fill:#eff6ff; stroke:#2563eb; stroke-width:2 }
      .cloud { fill:#fff7ed; stroke:#ea580c; stroke-width:2 }
      .storage { fill:#f0fdf4; stroke:#16a34a; stroke-width:2 }
      .line { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow) }
      .dash { fill:none; stroke:#64748b; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow) }
      .label { font:600 15px system-ui, sans-serif; fill:#0f172a; text-anchor:middle }
      .small { font:13px system-ui, sans-serif; fill:#334155; text-anchor:middle }
      .edge { font:12px system-ui, sans-serif; fill:#475569; text-anchor:middle }
      .group { fill:none; stroke:#94a3b8; stroke-width:2; stroke-dasharray:8 6 }
    </style>
  </defs>

  <rect class="cloud" x="40" y="35" width="160" height="58" rx="10"/>
  <text class="label" x="120" y="69">Internet</text>
  <rect class="cloud" x="245" y="35" width="205" height="58" rx="10"/>
  <text class="label" x="347" y="60">Remote users</text>
  <text class="small" x="347" y="80">and Alexa</text>
  <rect class="box" x="500" y="35" width="180" height="58" rx="10"/>
  <text class="label" x="590" y="69">Git repository</text>
  <rect class="cloud" x="745" y="35" width="190" height="58" rx="10"/>
  <text class="label" x="840" y="69">Cloudflare Tunnel</text>
  <rect class="cloud" x="980" y="35" width="180" height="58" rx="10"/>
  <text class="label" x="1070" y="60">Cloudflare DNS</text>
  <text class="small" x="1070" y="80">and DNS-01</text>

  <rect class="group" x="45" y="145" width="1110" height="390" rx="18"/>
  <text class="label" x="500" y="173">K3s on Fedora CoreOS</text>

  <rect class="accent" x="80" y="205" width="175" height="58" rx="10"/>
  <text class="label" x="167" y="239">Argo CD</text>
  <rect class="accent" x="305" y="205" width="175" height="58" rx="10"/>
  <text class="label" x="392" y="239">Traefik ingress</text>
  <rect class="accent" x="530" y="205" width="175" height="58" rx="10"/>
  <text class="label" x="617" y="239">cert-manager</text>
  <rect class="accent" x="755" y="205" width="175" height="58" rx="10"/>
  <text class="label" x="842" y="239">external-dns</text>
  <rect class="accent" x="980" y="205" width="140" height="58" rx="10"/>
  <text class="label" x="1050" y="230">cloudflared</text>
  <text class="small" x="1050" y="250">2 connectors</text>

  <rect class="box" x="180" y="330" width="190" height="58" rx="10"/>
  <text class="label" x="275" y="350">Secret replicator</text>
  <text class="small" x="275" y="372">and generators</text>
  <rect class="box" x="430" y="330" width="190" height="58" rx="10"/>
  <text class="label" x="525" y="350">Vertical Pod</text>
  <text class="small" x="525" y="372">Autoscaler</text>
  <rect class="accent" x="685" y="320" width="245" height="78" rx="12"/>
  <text class="label" x="807" y="350">Application services</text>
  <text class="small" x="807" y="374">Home Assistant and workloads</text>

  <rect class="storage" x="125" y="445" width="250" height="58" rx="10"/>
  <text class="label" x="250" y="468">SSD 256 GB</text>
  <text class="small" x="250" y="488">OS, state, fast PVs</text>
  <rect class="storage" x="475" y="445" width="250" height="58" rx="10"/>
  <text class="label" x="600" y="468">HDD 4 TB</text>
  <text class="small" x="600" y="488">media and documents</text>
  <rect class="storage" x="825" y="445" width="250" height="58" rx="10"/>
  <text class="label" x="950" y="468">USB 4 TB</text>
  <text class="small" x="950" y="488">optional backups</text>

  <path class="line" d="M120 93 V180 H392 V205"/>
  <text class="edge" x="190" y="135">HTTPS</text>
  <path class="line" d="M450 64 H470 V120 H840 V93"/>
  <text class="edge" x="650" y="114">outbound access</text>
  <path class="line" d="M590 93 V130 H167 V205"/>
  <text class="edge" x="280" y="124">GitOps</text>
  <path class="line" d="M840 93 V180 H1050 V205"/>
  <path class="dash" d="M842 205 V125 H1070 V93"/>
  <text class="edge" x="955" y="119">A records</text>
  <path class="dash" d="M617 205 V110 H1040 V93"/>
  <text class="edge" x="750" y="104">DNS-01</text>

  <path class="line" d="M167 263 V300 H807 V320"/>
  <text class="edge" x="425" y="293">reconciles</text>
  <path class="line" d="M392 263 V305 H750 V320"/>
  <path class="line" d="M1050 263 V290 H900 V320"/>
  <text class="edge" x="1000" y="284">HTTP 8123</text>
  <path class="line" d="M370 359 H685"/>
  <path class="line" d="M620 359 H685"/>
  <path class="line" d="M760 398 L300 445"/>
  <path class="line" d="M850 398 L625 445"/>
  <path class="dash" d="M900 398 L950 445"/>
</svg>
