apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: vertical-pod-autoscaler
      targetRevision: 0.13.0
      helm:
        values: |
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          admissionController:
            replicas: 1
            revisionHistoryLimit: 0
            logLevel: 2
            podDisruptionBudget:
              enabled: false
            image:
              repository: registry.k8s.io/autoscaling/vpa-admission-controller
              tag: 1.8.0@sha256:3d94f53e4c5a6891b8b32af545dda975e45842486432b69475afaf8df278d23d
            certGen:
              image:
                repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
                tag: v1.6.9@sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd
            resources:
              requests:
                cpu: 50m
                memory: 48Mi
              limits:
                memory: 48Mi
          recommender:
            replicas: 1
            revisionHistoryLimit: 0
            logLevel: 2
            podDisruptionBudget:
              enabled: false
            image:
              repository: registry.k8s.io/autoscaling/vpa-recommender
              tag: 1.8.0@sha256:e743e3a7e58a614f850063dba5df88eec5a19cf4cc43edb2050248df2d7dd8d3
            resources:
              requests:
                cpu: 50m
                memory: 48Mi
              limits:
                memory: 48Mi
            extraArgs:
              - --round-memory-bytes=1048576
              - --pod-recommendation-min-memory-mb=25
          updater:
            replicas: 1
            revisionHistoryLimit: 0
            logLevel: 2
            podDisruptionBudget:
              enabled: false
            image:
              repository: registry.k8s.io/autoscaling/vpa-updater
              tag: 1.8.0@sha256:1d0229e52f90f645f1ee2e86ddfac8f451d166777c2aab066b9c5ab5e8bc5d5c
            resources:
              requests:
                cpu: 50m
                memory: 48Mi
              limits:
                memory: 48Mi
            extraArgs:
              - --in-place-skip-disruption-budget=true
    - repoURL: git@github.com:Mahagon/homelab.git
      targetRevision: main
      path: k8s/apps/vpa/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: latest
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
