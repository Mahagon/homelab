    title: Zuhause
    views:
      - title: Übersicht
        path: start
        icon: mdi:home
        type: sections
        max_columns: 4
        dense_section_placement: true
        header:
          layout: center
          badges_position: bottom
          badges_wrap: wrap
          card:
            type: markdown
            text_only: true
            content: |
              {%- set h = now().hour -%}
              {%- set gruss = 'Gute Nacht' if h < 5 else 'Guten Morgen' if h < 11 else 'Guten Tag' if h < 18 else 'Guten Abend' -%}
              {%- set tage = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'] -%}
              {%- set monate = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'] -%}
              {%- set wetter = {'clear-night': 'Klare Nacht', 'cloudy': 'Bewölkt', 'exceptional': 'Unwetter', 'fog': 'Nebel', 'hail': 'Hagel', 'lightning': 'Gewitter', 'lightning-rainy': 'Gewitter mit Regen', 'partlycloudy': 'Teilweise bewölkt', 'pouring': 'Starkregen', 'rainy': 'Regen', 'snowy': 'Schnee', 'snowy-rainy': 'Schneeregen', 'sunny': 'Sonnig', 'windy': 'Windig', 'windy-variant': 'Windig und bewölkt'} -%}
              {%- set zustand = states('weather.messingen_wetter') -%}
              {%- set lichter = ['light.licht', 'light.licht_2', 'light.licht_3', 'light.licht_4', 'switch.treppenbeleuchtung'] | select('is_state', 'on') | list | count -%}
              {%- set rollos = ['cover.rolladen', 'cover.rolladen_2', 'cover.rolladen_3', 'cover.rolladen_4', 'cover.rolladen_5', 'cover.rolladen_6', 'cover.rolladen_7', 'cover.rolladen_8', 'cover.rolladen_9'] | select('is_state', 'open') | list | count -%}
              {%- set muell = state_attr('calendar.mullabfuhr', 'message') -%}
              {%- set muell_start = state_attr('calendar.mullabfuhr', 'start_time') -%}
              # {{ gruss }}, Daniel
              {{ tage[now().weekday()] }}, {{ now().day }}. {{ monate[now().month - 1] }} · {{ wetter.get(zustand, zustand) }}, {{ states('sensor.lingen_baccum_temperatur') | float(0) | round(0) | int }} °C

              <ha-icon icon="mdi:lightbulb-on-outline"></ha-icon> {{ lichter }} {{ 'Licht' if lichter == 1 else 'Lichter' }} an · <ha-icon icon="mdi:window-shutter-open"></ha-icon> {{ rollos }} {{ 'Rollladen' if rollos == 1 else 'Rollläden' }} offen
              {%- if muell and muell_start %}
              {%- set tage_bis = (as_datetime(muell_start).date() - now().date()).days %} · <ha-icon icon="mdi:trash-can-outline"></ha-icon> {{ muell }} {{ 'heute' if tage_bis == 0 else 'morgen' if tage_bis == 1 else 'am ' ~ as_datetime(muell_start).strftime('%d.%m.') }}
              {%- endif %}
        badges:
          - type: entity
            entity: person.mahagon
            show_name: false
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.total_dc_power
            name: Solar
            icon: mdi:solar-power-variant
            color: amber
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.battery_level
            name: Akku
            icon: mdi:home-battery
            color: green
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.load_power
            name: Verbrauch
            icon: mdi:home-lightning-bolt
            color: blue
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.import_power
            name: Netzbezug
            icon: mdi:transmission-tower-import
            color: red
            show_name: true
            show_state: true
            show_icon: true
            visibility:
              - condition: numeric_state
                entity: sensor.import_power
                above: 50
          - type: entity
            entity: sensor.export_power
            name: Einspeisung
            icon: mdi:transmission-tower-export
            color: teal
            show_name: true
            show_state: true
            show_icon: true
            visibility:
              - condition: numeric_state
                entity: sensor.export_power
                above: 50
          - type: entity
            entity: sensor.https_paperless_danieljacobs_de_dokumente_im_posteingang
            name: Posteingang
            icon: mdi:inbox-full
            color: purple
            show_name: true
            show_state: true
            show_icon: true
            visibility:
              - condition: numeric_state
