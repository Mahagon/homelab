apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-frontend-config
  namespace: home-assistant
data:
  frontend.yaml: |
    # Catppuccin (installed via HACS into /config/themes/catppuccin) as the
    # server-wide default theme: Latte in light mode, Mocha in dark mode.
    # frontend.set_theme persists the choice; re-applying it on every start keeps
    # it declarative. Browsers with a theme picked in the profile override it.
    automation:
      - id: catppuccin_default_theme
        alias: Catppuccin als Standard-Theme
        mode: single
        triggers:
          - trigger: homeassistant
            event: start
        actions:
          - action: frontend.set_theme
            data:
              name: Catppuccin Latte
              name_dark: Catppuccin Mocha

    # YAML dashboards are read-only in the UI; edit home-assistant-dashboards.
    lovelace:
      dashboards:
        dashboard-zuhause:
          mode: yaml
          title: Zuhause
          icon: mdi:home-heart
          show_in_sidebar: true
          require_admin: false
          filename: dashboards/zuhause.yaml
---
# Mounted as a directory (no subPath), so edits reach the pod without a
# restart; reload the browser to see them. Area cards only offer light and
# shutter controls: an area-wide switch control would also cut power to the
# fridge or the servers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-dashboards
  namespace: home-assistant
data:
