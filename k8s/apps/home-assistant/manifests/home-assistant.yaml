apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-init-scripts
  namespace: home-assistant
data:
  init-config.sh: |
    #!/bin/sh
    set -e

    mkdir -p /config/integrations

    if [ -f /config/configuration.yaml ]; then
      echo "configuration.yaml already exists, skipping."
      exit 0
    fi

    echo "Creating initial configuration.yaml..."
    cat > /config/configuration.yaml << 'HACFG'
    # Home Assistant configuration
    # Generated by homelab bootstrap - edit freely after first boot.

    default_config:

    homeassistant:
      packages: !include_dir_named integrations

    recorder:
      db_url: !env_var RECORDER_DB_URL

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
    HACFG

    echo "Done."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-alexa-config
  namespace: home-assistant
data:
  alexa.yaml: |
    homeassistant:
      external_url: https://homeassistant.${DOMAIN}
      internal_url: https://homeassistant.${DOMAIN}
      customize:
        light.licht:
          friendly_name: Esszimmer Licht
        light.licht_2:
          friendly_name: Wohnzimmer Licht
        light.licht_3:
          friendly_name: Küche Licht
        light.licht_4:
          friendly_name: Büro Licht
        cover.rolladen:
          friendly_name: Küche Rollladen
          device_class: shutter
        cover.rolladen_2:
          friendly_name: Esszimmer Rollladen
          device_class: shutter
        cover.rolladen_3:
          friendly_name: Gäste-WC Rollladen
          device_class: shutter
        cover.rolladen_4:
          friendly_name: Schlafzimmer Rollladen
          device_class: shutter
        cover.rolladen_5:
          friendly_name: Ankleidezimmer Rollladen
          device_class: shutter
        cover.rolladen_6:
          friendly_name: Büro Rollladen
          device_class: shutter
        cover.rolladen_7:
          friendly_name: Gästezimmer Rollladen
          device_class: shutter
        cover.rolladen_8:
          friendly_name: Büro Privat Rollladen
          device_class: shutter
        cover.rolladen_9:
          friendly_name: Badezimmer Rollladen
          device_class: shutter
        cover.shutters:
          friendly_name: Alle Rollläden
          device_class: shutter

    light:
      - platform: group
        name: Wohnraum Licht
        entities:
          - light.licht
          - light.licht_2
          - light.licht_3

    http:
      ip_ban_enabled: true
      login_attempts_threshold: 5

    alexa:
      smart_home:
        locale: de-DE
        filter:
          include_entities:
            - light.licht
            - light.licht_2
            - light.licht_3
            - light.licht_4
            - light.wohnraum_licht
            - cover.rolladen
            - cover.rolladen_2
            - cover.rolladen_3
            - cover.rolladen_4
            - cover.rolladen_5
            - cover.rolladen_6
            - cover.rolladen_7
            - cover.rolladen_8
            - cover.rolladen_9
            - cover.shutters
        entity_config:
          light.licht:
            name: Esszimmer Licht
            display_categories: LIGHT
          light.licht_2:
            name: Wohnzimmer Licht
            display_categories: LIGHT
          light.licht_3:
            name: Küche Licht
            display_categories: LIGHT
          light.licht_4:
            name: Büro Licht
            display_categories: LIGHT
          light.wohnraum_licht:
            name: Wohnraum Licht
            display_categories: LIGHT
          cover.rolladen:
            name: Küche Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_2:
            name: Esszimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_3:
            name: Gäste-WC Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_4:
            name: Schlafzimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_5:
            name: Ankleidezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_6:
            name: Büro Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_7:
            name: Gästezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_8:
            name: Büro Privat Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_9:
            name: Badezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.shutters:
            name: Alle Rollläden
            display_categories: INTERIOR_BLIND
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # hostNetwork gives HA access to mDNS / device discovery
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: [sh, /scripts/init-config.sh]
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: RECORDER_DB_URL
              value: "postgresql://homelab:$(PG_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/homeassistant"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
        - name: install-hacs
          image: alpine:3.24@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
          command: [sh, -c]
          args:
            - |
              HACS_VERSION="2.0.5"
              installed=$(grep -o '"version": *"[^"]*"' /config/custom_components/hacs/manifest.json 2>/dev/null | grep -o '[0-9][^"]*')
              if [ "$installed" = "$HACS_VERSION" ]; then
                echo "HACS $HACS_VERSION already installed, skipping."
                exit 0
              fi
              apk add --no-cache wget unzip
              wget -O /tmp/hacs.zip "https://github.com/hacs/integration/releases/download/${HACS_VERSION}/hacs.zip"
              rm -rf /config/custom_components/hacs
              mkdir -p /config/custom_components/hacs
              unzip /tmp/hacs.zip -d /config/custom_components/hacs
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: RECORDER_DB_URL
              value: "postgresql://homelab:$(PG_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/homeassistant"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: alexa-config
              mountPath: /config/integrations/alexa.yaml
              subPath: alexa.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: scripts
          configMap:
            name: home-assistant-init-scripts
            defaultMode: 0755
        - name: alexa-config
          configMap:
            name: home-assistant-alexa-config
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app: home-assistant
  ports:
    - port: 8123
      targetPort: 8123
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homeassistant.${DOMAIN}
      secretName: home-assistant-tls
  rules:
    - host: homeassistant.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
