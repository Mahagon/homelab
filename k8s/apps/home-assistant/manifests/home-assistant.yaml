apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-init-scripts
  namespace: home-assistant
data:
  init-config.sh: |
    #!/bin/sh
    set -e

    mkdir -p /config/integrations

    if [ -f /config/configuration.yaml ]; then
      echo "configuration.yaml already exists, skipping."
      exit 0
    fi

    echo "Creating initial configuration.yaml..."
    cat > /config/configuration.yaml << 'HACFG'
    # Home Assistant configuration
    # Generated by homelab bootstrap - edit freely after first boot.

    default_config:

    homeassistant:
      packages: !include_dir_named integrations

    recorder:
      db_url: !env_var RECORDER_DB_URL

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
    HACFG

    echo "Done."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-alexa-config
  namespace: home-assistant
data:
  alexa.yaml: |
    # Packages may only carry customize* under homeassistant:. Any other core
    # key (external_url, internal_url, ...) invalidates the whole block.
    homeassistant:
      customize:
        switch.computer:
          friendly_name: Computer
        switch.weihnachtsbaum:
          friendly_name: Weihnachtsbaum
        light.licht:
          friendly_name: Esszimmer Licht
        light.licht_2:
          friendly_name: Wohnzimmer Licht
        light.licht_3:
          friendly_name: Küche Licht
        light.licht_4:
          friendly_name: Büro Licht
        cover.rolladen:
          friendly_name: Küche Rollladen
          device_class: shutter
        cover.rolladen_2:
          friendly_name: Esszimmer Rollladen
          device_class: shutter
        cover.rolladen_3:
          friendly_name: Gäste-WC Rollladen
          device_class: shutter
        cover.rolladen_4:
          friendly_name: Schlafzimmer Rollladen
          device_class: shutter
        cover.rolladen_5:
          friendly_name: Ankleidezimmer Rollladen
          device_class: shutter
        cover.rolladen_6:
          friendly_name: Büro Rollladen
          device_class: shutter
        cover.rolladen_7:
          friendly_name: Gästezimmer Rollladen
          device_class: shutter
        cover.rolladen_8:
          friendly_name: Büro Privat Rollladen
          device_class: shutter
        cover.rolladen_9:
          friendly_name: Badezimmer Rollladen
          device_class: shutter
        cover.shutters:
          friendly_name: Alle Rollläden
          device_class: shutter

    # Member list and state aggregation only. Alexa and the UI use the
    # template light below, which keeps the light.wohnraum_licht entity ID.
    light:
      - platform: group
        name: Wohnraum Licht Gruppe
        entities:
          - light.licht
          - light.licht_2
          - light.licht_3

    template:
      - light:
          - name: Wohnraum Licht
            state: "{{ is_state('light.wohnraum_licht_gruppe', 'on') }}"
            level: "{{ state_attr('light.wohnraum_licht_gruppe', 'brightness') | default(0, true) }}"
            availability: "{{ states('light.wohnraum_licht_gruppe') not in ['unavailable', 'unknown'] }}"
            turn_on:
              - action: script.wohnraum_licht_set
                data:
                  target_state: "on"
            turn_off:
              - action: script.wohnraum_licht_set
                data:
                  target_state: "off"
            set_level:
              - action: script.wohnraum_licht_set
                data:
                  target_state: "on"
                  brightness: "{{ brightness }}"

    # The Shelly dimmers occasionally answer a command with an RPC error, which
    # left single lights in the old state. Send the command once, then resend
    # it to members that did not switch. Bounded to ~3s so the Alexa Lambda's
    # origin timeout is never reached.
    script:
      wohnraum_licht_set:
        alias: Wohnraum Licht schalten
        mode: restart
        fields:
          target_state:
            description: "on or off"
            required: true
          brightness:
            description: Optional brightness (0-255) when switching on
        variables:
          members: "{{ state_attr('light.wohnraum_licht_gruppe', 'entity_id') | list }}"
          light_data: "{{ {'brightness': brightness | int} if target_state == 'on' and brightness is defined else {} }}"
        sequence:
          - action: "light.turn_{{ target_state }}"
            target:
              entity_id: "{{ members }}"
            data: "{{ light_data }}"
            continue_on_error: true
          - repeat:
              count: 3
              sequence:
                - wait_template: "{{ members | reject('is_state', target_state) | reject('is_state', 'unavailable') | list | count == 0 }}"
                  timeout: 1
                - if: "{{ not wait.completed }}"
                  then:
                    - action: "light.turn_{{ target_state }}"
                      target:
                        entity_id: "{{ members | reject('is_state', target_state) | reject('is_state', 'unavailable') | list }}"
                      data: "{{ light_data }}"
                      continue_on_error: true

    # Log the error frame a Shelly returns for a rejected RPC call (code and
    # message) without the regular debug chatter of the websocket client.
    logger:
      default: warning
      logs:
        aioshelly.rpc_device.wsrpc: debug
      filters:
        aioshelly.rpc_device.wsrpc:
          - "^(send|result)\\("
          - "^Notification: "
          - "^handle call "
          - "^recv\\((?!.*'error')"

    http:
      ip_ban_enabled: true
      login_attempts_threshold: 5

    alexa:
      smart_home:
        locale: de-DE
        filter:
          include_entities:
            - switch.computer
            - switch.weihnachtsbaum
            - light.licht
            - light.licht_2
            - light.licht_3
            - light.licht_4
            - light.wohnraum_licht
            - cover.rolladen
            - cover.rolladen_2
            - cover.rolladen_3
            - cover.rolladen_4
            - cover.rolladen_5
            - cover.rolladen_6
            - cover.rolladen_7
            - cover.rolladen_8
            - cover.rolladen_9
            - cover.shutters
            - script.shutter_tv_state
        entity_config:
          switch.computer:
            name: Computer
            display_categories: SWITCH
          switch.weihnachtsbaum:
            name: Weihnachtsbaum
            display_categories: SWITCH
          light.licht:
            name: Esszimmer Licht
            display_categories: LIGHT
          light.licht_2:
            name: Wohnzimmer Licht
            display_categories: LIGHT
          light.licht_3:
            name: Küche Licht
            display_categories: LIGHT
          light.licht_4:
            name: Büro Licht
            display_categories: LIGHT
          light.wohnraum_licht:
            name: Wohnraum Licht
            display_categories: LIGHT
          cover.rolladen:
            name: Küche Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_2:
            name: Esszimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_3:
            name: Gäste-WC Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_4:
            name: Schlafzimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_5:
            name: Ankleidezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_6:
            name: Büro Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_7:
            name: Gästezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_8:
            name: Büro Privat Rollladen
            display_categories: INTERIOR_BLIND
          cover.rolladen_9:
            name: Badezimmer Rollladen
            display_categories: INTERIOR_BLIND
          cover.shutters:
            name: Rollläden
            display_categories: INTERIOR_BLIND
          # Scripts are Alexa scenes: "Alexa, aktiviere Fernsehen".
          script.shutter_tv_state:
            name: Fernsehen
            display_categories: ACTIVITY_TRIGGER
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # hostNetwork gives HA access to mDNS / device discovery
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: [sh, /scripts/init-config.sh]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: RECORDER_DB_URL
              value: "postgresql://homelab:$(PG_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/homeassistant"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
        - name: install-hacs
          image: alpine:3.24@sha256:71e9b7bae160ba167fa17414401b94cbcdaf3c32feeab9298bd794a2a0614c35
          command: [sh, -c]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - |
              HACS_VERSION="2.0.5"
              installed=$(grep -o '"version": *"[^"]*"' /config/custom_components/hacs/manifest.json 2>/dev/null | grep -o '[0-9][^"]*')
              if [ "$installed" = "$HACS_VERSION" ]; then
                echo "HACS $HACS_VERSION already installed, skipping."
                exit 0
              fi
              apk add --no-cache wget unzip
              wget -O /tmp/hacs.zip "https://github.com/hacs/integration/releases/download/${HACS_VERSION}/hacs.zip"
              rm -rf /config/custom_components/hacs
              mkdir -p /config/custom_components/hacs
              unzip /tmp/hacs.zip -d /config/custom_components/hacs
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: password
            - name: RECORDER_DB_URL
              value: "postgresql://homelab:$(PG_PASSWORD)@postgresql.postgresql.svc.cluster.local:5432/homeassistant"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: alexa-config
              mountPath: /config/integrations/alexa.yaml
              subPath: alexa.yaml
              readOnly: true
            - name: frontend-config
              mountPath: /config/integrations/frontend.yaml
              subPath: frontend.yaml
              readOnly: true
            - name: dashboards
              mountPath: /config/dashboards
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: scripts
          configMap:
            name: home-assistant-init-scripts
            defaultMode: 0755
        - name: alexa-config
          configMap:
            name: home-assistant-alexa-config
        - name: frontend-config
          configMap:
            name: home-assistant-frontend-config
        - name: dashboards
          configMap:
            name: home-assistant-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  selector:
    app: home-assistant
  ports:
    - port: 8123
      targetPort: 8123
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homeassistant.${DOMAIN}
      secretName: home-assistant-tls
  rules:
    - host: homeassistant.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
