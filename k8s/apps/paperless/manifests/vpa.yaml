apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: paperless
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paperless
  resourcePolicy:
    containerPolicies:
      - containerName: paperless
        minAllowed:
          memory: 786Mi
        maxAllowed:
          # Uncapped, OCR bursts push the CPU request past what the single node
          # can schedule. No CPU limit is set, so paperless can still burst.
          cpu: 500m
          memory: 2Gi
  updatePolicy:
    updateMode: InPlaceOrRecreate
