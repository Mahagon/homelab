apiVersion: v1
kind: Secret
metadata:
  name: restic-credentials
  namespace: backup
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "password"
    secret-generator.v1.mittwald.de/encoding: "base64url"
    secret-generator.v1.mittwald.de/length: "32"
    helm.sh/resource-policy: keep
    # Never prune or cascade-delete: a regenerated value breaks existing data.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
---
# Daily: SSD PVCs + PostgreSQL dump
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-backup-daily
  namespace: backup
spec:
  # Mon-Sat at 01:00 - skip Sunday to avoid conflicts with Zincati update window (Sun 03:00-05:00)
  schedule: "0 1 * * 1-6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: pg-dump
              image: postgres:18.6-alpine3.23@sha256:1a0c23d53c1ad77468c8653fa6eed4f4105cfbef9e6f027bc1dfeb16949a8c29
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "==> Dumping PostgreSQL databases..."
                  PGPASSWORD="$PG_PASSWORD" pg_dumpall \
                    -h postgresql.postgresql.svc.cluster.local \
                    -U homelab \
                    > /pgdump/dump.sql
                  echo "    Done: $(du -sh /pgdump/dump.sql | cut -f1)"
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: pgdump
                  mountPath: /pgdump
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  export RESTIC_REPOSITORY=/backup/restic-repo
                  export RESTIC_PASSWORD="$RESTIC_PASSWORD"
                  export GOMAXPROCS=2

                  # Refuse to run unless /backup is the root of a mounted filesystem (the USB
                  # drive). Unmounted, the hostPath is a plain directory on the /var SSD
                  # partition and restic would silently fill the root disk.
                  if [ "$(awk '$5 == "/backup" { print $4 }' /proc/self/mountinfo)" != "/" ]; then
                    echo "==> Backup drive is not mounted at /var/mnt/backup; aborting." >&2
                    exit 1
                  fi

                  # Shared lock with the other backup CronJob (same node, same hostPath);
                  # skip this run if a backup is still in progress. Released when the pod exits.
                  # Kept inside the repo dir: the mount root itself is not writable by the container.
                  mkdir -p "$RESTIC_REPOSITORY"
                  exec 9>"$RESTIC_REPOSITORY/.homelab-backup.lock"
                  if ! flock -n 9; then
                    echo "==> Another backup is still running, skipping this run."
                    exit 0
                  fi

                  # Initialise repo on first run
                  if ! restic snapshots >/dev/null 2>&1; then
                    echo "==> Initialising restic repository..."
                    restic init
                  fi

                  echo "==> Backing up SSD PVCs (config/data volumes)..."
                  restic backup /data/ssd --tag pvcs-ssd --host homelab

                  echo "==> Backing up PostgreSQL dump..."
                  restic backup /pgdump --tag postgresql --host homelab

                  # Paperless documents live on the HDD, but their database rows are in the
                  # daily dump; back them up daily too so a restore stays consistent.
                  paperless_media_found=false
                  for dir in /data/hdd/pvc-*_paperless_paperless-media; do
                    [ -d "$dir" ] || continue
                    paperless_media_found=true
                    echo "==> Backing up Paperless media..."
                    restic backup "$dir" --tag paperless-media --host homelab
                  done

                  echo "==> Pruning old SSD/PostgreSQL/Paperless media snapshots..."
                  restic unlock
                  restic forget \
                    --group-by paths,tags \
                    --tag pvcs-ssd \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 6 \
                    --prune
                  restic forget \
                    --group-by paths,tags \
                    --tag postgresql \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 6 \
                    --prune
                  restic forget \
                    --group-by paths,tags \
                    --tag paperless-media \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 6 \
                    --prune

                  echo "==> Daily backup complete."
                  restic snapshots

                  if [ "$paperless_media_found" != true ]; then
                    echo "==> Paperless media volume not found under /data/hdd; it was not backed up." >&2
                    exit 1
                  fi
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_READ_SEARCH
              resources:
                limits:
                  cpu: "2"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: pvc-ssd
                  mountPath: /data/ssd
                  readOnly: true
                - name: pvc-hdd
                  mountPath: /data/hdd
                  readOnly: true
                - name: pgdump
                  mountPath: /pgdump
                  readOnly: true
          volumes:
            - name: backup
              hostPath:
                path: /var/mnt/backup
                type: Directory
            - name: pvc-ssd
              hostPath:
                path: /var/lib/homelab
                type: Directory
            - name: pvc-hdd
              hostPath:
                path: /var/mnt/data
                type: Directory
            - name: pgdump
              emptyDir: {}
---
# Weekly: HDD PVCs (media volumes)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homelab-backup-weekly
  namespace: backup
spec:
  # Saturday at 03:00
  schedule: "0 3 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restic
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  export RESTIC_REPOSITORY=/backup/restic-repo
                  export RESTIC_PASSWORD="$RESTIC_PASSWORD"
                  export GOMAXPROCS=2

                  # Refuse to run unless /backup is the root of a mounted filesystem (the USB
                  # drive). Unmounted, the hostPath is a plain directory on the /var SSD
                  # partition and restic would silently fill the root disk.
                  if [ "$(awk '$5 == "/backup" { print $4 }' /proc/self/mountinfo)" != "/" ]; then
                    echo "==> Backup drive is not mounted at /var/mnt/backup; aborting." >&2
                    exit 1
                  fi

                  # Shared lock with the other backup CronJob (same node, same hostPath);
                  # skip this run if a backup is still in progress. Released when the pod exits.
                  # Kept inside the repo dir: the mount root itself is not writable by the container.
                  mkdir -p "$RESTIC_REPOSITORY"
                  exec 9>"$RESTIC_REPOSITORY/.homelab-backup.lock"
                  if ! flock -n 9; then
                    echo "==> Another backup is still running, skipping this run."
                    exit 0
                  fi

                  # Initialise repo on first run
                  if ! restic snapshots >/dev/null 2>&1; then
                    echo "==> Initialising restic repository..."
                    restic init
                  fi

                  # Same check for the data HDD: an unmounted /var/mnt/data would yield
                  # empty snapshots that push real ones out of the weekly retention.
                  if [ "$(awk '$5 == "/data/hdd" { print $4 }' /proc/self/mountinfo)" != "/" ]; then
                    echo "==> Data HDD is not mounted at /var/mnt/data; aborting." >&2
                    exit 1
                  fi

                  echo "==> Backing up HDD PVCs (media volumes)..."
                  restic backup /data/hdd --tag pvcs-hdd --host homelab

                  echo "==> Pruning old HDD snapshots..."
                  restic unlock
                  restic forget \
                    --group-by paths,tags \
                    --tag pvcs-hdd \
                    --keep-weekly 8 \
                    --prune

                  echo "==> Weekly backup complete."
                  restic snapshots
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - DAC_READ_SEARCH
              resources:
                limits:
                  cpu: "2"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: pvc-hdd
                  mountPath: /data/hdd
                  readOnly: true
          volumes:
            - name: backup
              hostPath:
                path: /var/mnt/backup
                type: Directory
            - name: pvc-hdd
              hostPath:
                path: /var/mnt/data
                type: Directory
