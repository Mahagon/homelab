apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        values: |
          alloy:
            configMap:
              create: false
              name: alloy-config
              key: config.alloy
            mounts:
              varlog: true
            clustering:
              enabled: false
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
            extraEnv:
              - name: GOMEMLIMIT
                value: "200MiB"
          configReloader:
            enabled: false
          controller:
            type: daemonset
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "12345"
          serviceAccount:
            create: true
          crds:
            create: false
    - repoURL: git@github.com:Mahagon/homelab.git
      targetRevision: main
      path: k8s/apps/grafana-alloy/manifests
      plugin:
        name: envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-alloy
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: latest
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
