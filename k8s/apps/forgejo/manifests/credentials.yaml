apiVersion: v1
kind: Secret
metadata:
  name: forgejo-credentials
  namespace: forgejo
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: "SECRET_KEY,INTERNAL_TOKEN,ADMIN_PASSWORD"
    secret-generator.v1.mittwald.de/encoding: "base64url"
    secret-generator.v1.mittwald.de/length: "48"
    helm.sh/resource-policy: keep
    # Never prune or cascade-delete: a regenerated value breaks existing data.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
