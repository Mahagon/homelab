apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ip-bans
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Mahagon/homelab.git
    targetRevision: main
    path: k8s/apps/ip-bans/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ip-bans
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
