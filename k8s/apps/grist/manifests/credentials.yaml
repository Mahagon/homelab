apiVersion: v1
kind: Secret
metadata:
  name: grist-credentials
  namespace: grist
  annotations:
    # GRIST_BOOT_KEY signs in as the installation admin at /boot (recovery only).
    secret-generator.v1.mittwald.de/autogenerate: "GRIST_SESSION_SECRET,GRIST_BOOT_KEY"
    secret-generator.v1.mittwald.de/encoding: "base64url"
    secret-generator.v1.mittwald.de/length: "48"
    helm.sh/resource-policy: keep
    # Never prune or cascade-delete: a regenerated value breaks existing data.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
