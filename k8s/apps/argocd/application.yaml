apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.1
      helm:
        values: |
          global:
            domain: argocd.${DOMAIN}
          configs:
            cm:
              url: https://argocd.${DOMAIN}
              dex.config: |
                connectors:
                  - type: github
                    id: github
                    name: GitHub
                    config:
                      clientID: $dex.github.clientID
                      clientSecret: $dex.github.clientSecret
                      redirectURI: https://argocd.${DOMAIN}/api/dex/callback
            rbac:
              policy.csv: |
                g, ${EMAIL}, role:admin
              scopes: "[groups, email]"
            params:
              server.insecure: true
              otlp.address: grafana-alloy.grafana-alloy.svc.cluster.local:4317
              otlp.attrs: k8s.cluster.name:homelab,deployment.environment.name:homelab
              otlp.insecure: true
          controller:
            metrics:
              enabled: true
            extraArgs:
              - --status-processors=5
              - --operation-processors=3
              - --kubectl-parallelism-limit=5
              - --app-resync=300
            env:
              - name: GOGC
                value: "20"
          server:
            metrics:
              enabled: true
            ingress:
              enabled: false
            certificate:
              enabled: true
              issuer:
                kind: ClusterIssuer
                name: letsencrypt-prod
          notifications:
            enabled: false
          repoServer:
            metrics:
              enabled: true
            volumes:
              - name: cmp-envsubst-config
                configMap:
                  name: argocd-cmp-envsubst
              - name: cmp-envsubst-apps-config
                configMap:
                  name: argocd-cmp-envsubst-apps
            extraContainers:
              - name: cmp-envsubst
                image: quay.io/argoproj/argocd:v3.5.3@sha256:dd3f47d5a5e4da563a7a398506e892481b358a7cec50abdf320c71aa55904bfa
                command: [/var/run/argocd/argocd-cmp-server]
                env:
                  - name: DOMAIN
                    valueFrom:
                      secretKeyRef:
                        name: homelab-config
                        key: domain
                  - name: EMAIL
                    valueFrom:
                      secretKeyRef:
                        name: homelab-config
                        key: email
                volumeMounts:
                  - mountPath: /var/run/argocd
                    name: var-files
                  - mountPath: /home/argocd/cmp-server/plugins
                    name: plugins
                  - mountPath: /tmp
                    name: tmp
                  - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                    subPath: plugin.yaml
                    name: cmp-envsubst-config
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 999
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  seccompProfile:
                    type: RuntimeDefault
                  capabilities:
                    drop:
                      - ALL
              - name: cmp-envsubst-apps
                image: quay.io/argoproj/argocd:v3.5.3@sha256:dd3f47d5a5e4da563a7a398506e892481b358a7cec50abdf320c71aa55904bfa
                command: [/var/run/argocd/argocd-cmp-server]
                env:
                  - name: DOMAIN
                    valueFrom:
                      secretKeyRef:
                        name: homelab-config
                        key: domain
                  - name: EMAIL
                    valueFrom:
                      secretKeyRef:
                        name: homelab-config
                        key: email
                volumeMounts:
                  - mountPath: /var/run/argocd
                    name: var-files
                  - mountPath: /home/argocd/cmp-server/plugins
                    name: plugins
                  - mountPath: /tmp
                    name: tmp
                  - mountPath: /home/argocd/cmp-server/config/plugin.yaml
                    subPath: plugin.yaml
                    name: cmp-envsubst-apps-config
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 999
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  seccompProfile:
                    type: RuntimeDefault
                  capabilities:
                    drop:
                      - ALL
    # Additional manifests (IngressRoute, etc.)
    - repoURL: git@github.com:Mahagon/homelab.git
      targetRevision: main
      path: k8s/apps/argocd/manifests
      plugin:
        name: envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
