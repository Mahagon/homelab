name: Apply Home Assistant Alexa infrastructure

on:
  workflow_dispatch:
    inputs:
      publish_dns:
        description: Publish the Cloudflare CNAME (only after connectors are healthy)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: home-assistant-alexa-production
  cancel-in-progress: false

jobs:
  apply:
    name: Plan and apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OPENTOFU_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_budget_email: ${{ vars.AWS_BUDGET_EMAIL }}
      TF_VAR_alexa_skill_id: ${{ vars.ALEXA_SKILL_ID }}
      TF_VAR_publish_dns: ${{ inputs.publish_dns }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-home-assistant-alexa
          aws-region: eu-west-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Initialize remote state
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu init -input=false -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: Validate
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu validate

      - name: Create reviewed plan
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        run: |
          set +e
          tofu plan -input=false -out=deployment.tfplan -detailed-exitcode
          exit_code=$?
          set -e
          if [[ ${exit_code} -eq 1 ]]; then
            exit 1
          fi
          echo "TOFU_PLAN_EXIT_CODE=${exit_code}" >> "${GITHUB_ENV}"

      - name: Apply reviewed plan
        if: env.TOFU_PLAN_EXIT_CODE == '2'
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu apply -input=false -auto-approve deployment.tfplan

      - name: Confirm no post-apply drift
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        run: |
          set +e
          tofu plan -input=false -detailed-exitcode
          exit_code=$?
          set -e
          if [[ ${exit_code} -ne 0 ]]; then
            echo "Expected an empty post-apply plan, got exit code ${exit_code}." >&2
            exit 1
          fi

