name: Security and IaC checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/security/**"
      - ".checkov.yml"
      - ".tflint.hcl"
      - ".trivyignore"
      - "butane/**"
      - "infrastructure/**"
      - "k8s/**"
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Plan and apply the production stack from main
        required: true
        type: boolean
        default: false
      allow_destroy:
        description: Allow delete or replacement actions in a manual production plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-iac-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Deployment change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect deployable changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          deploy=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy="${REQUESTED_APPLY}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base="${BEFORE_SHA}"
            if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${GITHUB_SHA}^")"
            fi

            if git diff --name-only "${base}" "${GITHUB_SHA}" |
              grep -Eq '^infrastructure/opentofu/home-assistant-alexa/main/(.*\.tf|.*\.tf\.json|\.terraform\.lock\.hcl|lambda/)'; then
              deploy=true
            fi
          fi

          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"

  inventory:
    name: Deployed image inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      images: ${{ steps.inventory.outputs.images }}
    env:
      KUBERNETES_VERSION: "1.36.3"
      HELM_VERSION: "v4.2.4"
      PYYAML_VERSION: "6.0.3"
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install inventory dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Test Kubernetes tooling
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Enforce owned workload runtime policy
        run: python .github/scripts/kubernetes_policy.py

      - name: Build deployed image inventory
        id: inventory
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode=all
          base=""
          head="${GITHUB_SHA}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            mode=changed
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            mode=changed
            base="${BEFORE_SHA}"
            if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse "${GITHUB_SHA}^")"
            fi
          fi

          args=(
            --mode "${mode}"
            --head "${head}"
            --output .rendered/security
            --matrix-output .rendered/security/images.json
            --github-output "${GITHUB_OUTPUT}"
            --kubernetes-version "${KUBERNETES_VERSION}"
          )
          if [[ "${mode}" == "changed" ]]; then
            args+=(--base "${base}")
          fi
          python .github/scripts/kubernetes_inventory.py "${args[@]}"

      - name: Validate rendered Kubernetes resources
        shell: bash
        run: |
          set -euo pipefail
          if find .rendered/security/head -type f -name '*.yaml' -print -quit | grep -q .; then
            docker run --rm \
              --volume "${PWD}/.rendered/security/head:/work:ro" \
              ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
              -strict \
              -summary \
              -ignore-missing-schemas \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              /work
          else
            echo "No changed Kubernetes resources require schema validation."
          fi

  opentofu:
    name: OpenTofu and Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive infrastructure/opentofu/home-assistant-alexa

      - name: Validate and test OpenTofu roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap main; do
            directory="infrastructure/opentofu/home-assistant-alexa/${root}"
            tofu -chdir="${directory}" init -backend=false -input=false
            tofu -chdir="${directory}" validate
            tofu -chdir="${directory}" test -no-color
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: Run TFLint
        shell: bash
        run: |
          set -euo pipefail
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          for root in bootstrap main; do
            tflint \
              --chdir="infrastructure/opentofu/home-assistant-alexa/${root}" \
              --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Test Lambda
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.15

      - name: Check OpenTofu security
        run: >-
          checkov
          --directory infrastructure/opentofu/home-assistant-alexa
          --framework terraform

  kubernetes_checks:
    name: Kubernetes configuration and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render changed manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rendered
          for manifest in k8s/apps/cloudflared/manifests/*.yaml; do
            sed \
              -e 's/${DOMAIN}/example.invalid/g' \
              -e 's/${EMAIL}/security@example.com/g' \
              "$manifest" >> .rendered/cloudflared.yaml
            printf '\n---\n' >> .rendered/cloudflared.yaml
          done
          sed \
            -e 's/${DOMAIN}/example.invalid/g' \
            -e 's/${EMAIL}/security@example.com/g' \
            k8s/apps/home-assistant/manifests/home-assistant.yaml \
            > .rendered/home-assistant.yaml

      - name: Verify templated applications use envsubst
        shell: bash
        run: |
          set -euo pipefail
          grep -rlF '${DOMAIN}' k8s/apps/*/manifests/*.yaml |
            while read -r manifest; do
              dirname "$(dirname "$manifest")"
            done |
            sort -u |
            while read -r app_dir; do
              application="$app_dir/application.yaml"
              if ! grep -A3 -F "path: $app_dir/manifests" "$application" |
                grep -qF "name: envsubst"; then
                echo "::error file=$application::Manifests use ${DOMAIN}, but this Application does not select the envsubst plugin."
                exit 1
              fi
            done

      - name: Validate README Mermaid diagrams
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0777 "${RUNNER_TEMP}/mermaid"
          for diagram in docs/diagrams/*.mmd; do
            output="${RUNNER_TEMP}/mermaid/$(basename "${diagram%.mmd}").svg"
            docker run --rm \
              --volume "${PWD}/docs/diagrams:/data:ro" \
              --volume "${RUNNER_TEMP}/mermaid:/output" \
              ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:11.16.1@sha256:e7fc5c569c039c7d663e875ac0fe70828910f686b9bbee2d064f7e8a096d49f8 \
              -i "/data/$(basename "$diagram")" \
              -o "/output/$(basename "$output")"
          done

      - name: Validate Kubernetes schemas
        run: >-
          docker run --rm
          --volume "${PWD}/.rendered:/work:ro"
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary /work

      - name: Scan IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: infrastructure/opentofu/home-assistant-alexa
          scanners: misconfig
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Scan the cloudflared network boundary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: k8s/apps/cloudflared/manifests
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true


      - name: Scan entire repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  image_scan_pr:
    name: PR image scan (${{ matrix.target.image }})
    needs: inventory
    if: github.event_name == 'pull_request' && needs.inventory.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan changed image without publishing details
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ matrix.target.image }}
          trivyignores: ${{ matrix.target.ignorefile }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: "1"
          hide-progress: true

      - name: Explain local remediation
        if: failure()
        env:
          IMAGE: ${{ matrix.target.image }}
        run: echo "The changed image failed the vulnerability policy. Run Trivy against ${IMAGE} locally for details."

  image_scan_trusted:
    name: Trusted image scan (${{ matrix.target.image }})
    needs: inventory
    if: github.event_name != 'pull_request' && needs.inventory.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan deployed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ matrix.target.image }}
          trivyignores: ${{ matrix.target.ignorefile }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: "1"
          hide-progress: true

      - name: Publish findings to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container/${{ matrix.target.category }}

  kubernetes:
    name: Kubernetes and secret scanning
    if: always()
    needs:
      - inventory
      - kubernetes_checks
      - image_scan_pr
      - image_scan_trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable security checks
        shell: bash
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes_checks.result }}
          PR_SCAN_RESULT: ${{ needs.image_scan_pr.result }}
          TRUSTED_SCAN_RESULT: ${{ needs.image_scan_trusted.result }}
        run: |
          set -euo pipefail
          [[ "${INVENTORY_RESULT}" == "success" ]]
          [[ "${KUBERNETES_RESULT}" == "success" ]]
          [[ "${PR_SCAN_RESULT}" == "success" || "${PR_SCAN_RESULT}" == "skipped" ]]
          [[ "${TRUSTED_SCAN_RESULT}" == "success" || "${TRUSTED_SCAN_RESULT}" == "skipped" ]]

  apply:
    name: Plan and apply production
    needs:
      - changes
      - opentofu
      - kubernetes
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy == 'true' &&
      needs.opentofu.result == 'success' &&
      needs.kubernetes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_home_assistant_domain: ${{ secrets.HOME_ASSISTANT_DOMAIN }}
      TF_VAR_budget_email: ${{ secrets.AWS_BUDGET_EMAIL }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_alexa_skill_id: ${{ vars.ALEXA_SKILL_ID }}
      TF_VAR_publish_dns: ${{ vars.PUBLISH_DNS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mask derived Home Assistant values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TF_VAR_home_assistant_domain}" ]]; then
            echo "HOME_ASSISTANT_DOMAIN is not configured in aws-production." >&2
            exit 1
          fi
          echo "::add-mask::${TF_VAR_home_assistant_domain}"
          echo "::add-mask::homeassistant.${TF_VAR_home_assistant_domain}"
          echo "::add-mask::https://homeassistant.${TF_VAR_home_assistant_domain}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-home-assistant-alexa
          aws-region: eu-west-1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Initialize remote state
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu init -input=false -backend-config="bucket=${{ vars.TOFU_STATE_BUCKET }}"

      - name: Validate production root
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu validate

      - name: Create deployment plan
        id: plan
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        run: |
          set +e
          tofu plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out=deployment.tfplan \
            -detailed-exitcode
          exit_code=$?
          set -e

          if [[ ${exit_code} -eq 1 ]]; then
            exit 1
          fi
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"

      - name: Reject unapproved destructive changes
        if: steps.plan.outputs.exit_code == '2'
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        env:
          ALLOW_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destroy }}
        run: |
          set -euo pipefail
          if [[ "${ALLOW_DESTROY}" == "true" ]]; then
            exit 0
          fi

          destructive_count="$(
            tofu show -json deployment.tfplan |
              jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length'
          )"
          if [[ "${destructive_count}" -ne 0 ]]; then
            echo "The plan contains ${destructive_count} delete or replacement action(s)." >&2
            echo "Review it, then use a manual main-branch dispatch with allow_destroy=true if intentional." >&2
            exit 1
          fi

      - name: Apply saved plan
        if: steps.plan.outputs.exit_code == '2'
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        run: tofu apply -input=false -auto-approve deployment.tfplan

      - name: Confirm no post-apply drift
        if: steps.plan.outputs.exit_code == '2'
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        run: |
          set +e
          tofu plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out=post-apply.tfplan \
            -detailed-exitcode
          exit_code=$?
          set -e

          if [[ ${exit_code} -eq 0 ]]; then
            exit 0
          fi
          if [[ ${exit_code} -eq 1 ]]; then
            exit 1
          fi

          dnssec_pending_only="$(
            tofu show -json post-apply.tfplan |
              jq -r '
                [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes |
                ($changes | length == 1) and
                ($changes[0].address == "cloudflare_zone_dnssec.zone") and
                ($changes[0].change.actions == ["update"]) and
                ($changes[0].change.before.status == "pending") and
                ($changes[0].change.after.status == "active")
              '
          )"
          if [[ "${dnssec_pending_only}" == "true" ]]; then
            echo "::warning::Cloudflare DNSSEC is pending registrar DS publication; no other post-apply drift exists."
          else
            echo "Expected an empty post-apply plan; unexpected drift remains." >&2
            exit 1
          fi

      - name: Remove sensitive plan file
        if: always()
        working-directory: infrastructure/opentofu/home-assistant-alexa/main
        shell: bash
        run: rm -f deployment.tfplan post-apply.tfplan
