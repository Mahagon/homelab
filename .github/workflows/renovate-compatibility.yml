name: Renovate compatibility

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: renovate-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBERNETES_VERSION: "1.36.3"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.2.4"
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_IMAGE: "ghcr.io/renovatebot/renovate:44.65.2@sha256:b1a226090cb54ee3f93162c407a6b250a90c9cca2895c4ae7529135c159a0f5b"
  # renovate: datasource=pypi depName=PyYAML
  PYYAML_VERSION: "6.0.3"

jobs:
  compatibility:
    name: Renovate compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Renovate configuration
        shell: bash
        run: >-
          docker run --rm
          --volume "${PWD}:/usr/src/app:ro"
          --workdir /usr/src/app
          "${RENOVATE_IMAGE}"
          renovate-config-validator
          .github/renovate.json
          --strict

      - name: Report non-Renovate pull request
        if: github.event.pull_request.user.login != 'renovate[bot]'
        run: echo "Compatibility checks are not applicable to pull requests not authored by renovate[bot]."

      - name: Set up Python
        if: github.event.pull_request.user.login == 'renovate[bot]'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install compatibility-check dependencies
        if: github.event.pull_request.user.login == 'renovate[bot]'
        run: python -m pip install --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"

      - name: Set up Helm
        if: github.event.pull_request.user.login == 'renovate[bot]'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Test compatibility checker
        if: github.event.pull_request.user.login == 'renovate[bot]'
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

      - name: Render and inspect changed dependencies
        if: github.event.pull_request.user.login == 'renovate[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python .github/scripts/renovate_compatibility.py
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --output .rendered/renovate
          --kubernetes-version "${KUBERNETES_VERSION}"

      - name: Validate rendered Kubernetes resources
        if: github.event.pull_request.user.login == 'renovate[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if find .rendered/renovate -type f -name '*.yaml' -print -quit | grep -q .; then
            docker run --rm \
              --volume "${PWD}/.rendered/renovate:/work:ro" \
              ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
              -strict \
              -summary \
              -ignore-missing-schemas \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              /work
          else
            echo "No changed Kubernetes resources require schema validation."
          fi
